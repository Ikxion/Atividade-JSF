<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Cadastro de Pessoas</title>
        <h:outputStylesheet library="css" name="main.css" />
</h:head>
<h:body>
<!-- Formulário de cadastro -->
    <h:form>
        <h2>Cadastrar Pessoa</h2>

        <h:outputLabel for="nome" value="Nome:" />
        <h:inputText id="nome" value="#{pessoaBean.novaPessoa.nome}" />
        <br/>
        
         <h:outputLabel for="nacionalidade" value="Nacionalidade:" />
        <h:inputText id="nacionalidade" value="#{pessoaBean.novaPessoa.nacionalidade}" />
        <br/>

        <h:outputLabel for="idade" value="Idade:" />
        <h:inputText id="idade" value="#{pessoaBean.novaPessoa.idade}" />
        <br/>

        <h:commandButton value="Cadastrar" action="#{pessoaBean.cadastrar}" />
        <br/><br/>

        <h2>Lista de Pessoas</h2>
        <ui:repeat value="#{pessoaBean.pessoas}" var="pessoa">
                <b>Nome:</b> #{pessoa.nome} <br/>
                <b>Idade:</b> #{pessoa.idade} <br/>
                <b>Nacionalidade:</b> #{pessoa.nacionalidade} <br/><br/>
                <h:commandButton value="Remover" action="#{pessoaBean.remover(pessoa)}" class="button-remover"/>
                <hr/>
        </ui:repeat>
    </h:form>
</h:body>
</html>
